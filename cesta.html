<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SHAIN - Cesta de la compra</title>
    <link rel="stylesheet" href="css/style.css" />
    <script src="js/loadNav.js"></script>
  </head>
  <body>
    <div id="top-banner">
      <p id="top-banner-text">
        VENTA FLASH ⚡ 70% DE DESCUENTO EN TODO EL SITIO + ENVÍO GRATIS A PARTIR
        DE <span>29.00€</span>
      </p>
    </div>
    <div id="navbar"></div>

    <main class="store-layout">
      <section class="cart-page-section">
        <div class="section-header">
          <h2 class="section-title">Mi Cesta</h2>
          <a href="index.html" class="go-to-cart-btn">Volver a la Tienda</a>
        </div>
        <div class="cart-container-page">
          <div id="items-cesta" class="cart-items-page">
            <!-- Items de la cesta se cargan aquí -->
          </div>
          <div class="cart-footer">
            <p id="total-cesta">Total: 0.00€</p>
            <button class="checkout-btn">Finalizar Compra</button>
          </div>
        </div>
      </section>
    </main>

    <script src="js/productos.js"></script>
  </body>
</html>
