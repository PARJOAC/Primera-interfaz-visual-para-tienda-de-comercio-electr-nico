<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SHAIN - Cesta de la compra</title>
    <link rel="stylesheet" href="css/styles.css" />
    <script src="js/loadNav.js"></script>
  </head>
  <body>
    <div id="top-banner">
      <p id="top-banner-text">
        VENTA FLASH ⚡ 70% DE DESCUENTO EN TODO EL SITIO + ENVÍO GRATIS A PARTIR
        DE <span>29.00€</span>
      </p>
    </div>
    <div id="navbar"></div>

    <main class="diseno-tienda">
      <section class="seccion-pagina-carrito">
        <div class="cabecera-seccion">
          <h2 class="titulo-seccion">Mi Cesta</h2>
          <a href="index.html" class="boton-ir-carrito">Volver a la Tienda</a>
        </div>
        <div class="contenedor-carrito-pagina">
          <div id="items-cesta" class="elemento-carrito-pagina">
            <!-- Items de la cesta se cargan aquí -->
          </div>
          <div class="pie-carrito">
            <p id="total-cesta">Total: 0.00€</p>
            <button class="boton-pagar">Finalizar Compra</button>
          </div>
        </div>
      </section>
    </main>

    <script src="js/productos.js"></script>
  </body>
</html>
